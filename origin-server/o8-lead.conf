# ORIGIN 官网留资 / 转化事件反代（迭代 08.5 建，08.6 扩展）
# 由主 vhost 的 include /www/server/panel/vhost/nginx/extension/originintl.cn/*.conf 自动加载
# 后端：PM2 进程 origin-lead（127.0.0.1:3100），仅本机监听，不对外暴露端口。
# 一律使用精确匹配（= ），避免吃掉站点其它路径。

location = /api/tool-lead {
    proxy_pass http://127.0.0.1:3100/lead;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 15s;
    client_max_body_size 16k;
}

# 匿名转化事件（08.6）：只记地区 / 分数档 / 步骤，不含身份与答案
location = /api/tool-event {
    proxy_pass http://127.0.0.1:3100/event;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 10s;
    client_max_body_size 8k;
}

# 只读聚合统计（08.6）：需 STATS_TOKEN，返回聚合数据，不含姓名与联系方式
location = /api/lead-stats {
    proxy_pass http://127.0.0.1:3100/stats$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 10s;
}

location = /api/health {
    proxy_pass http://127.0.0.1:3100/health;
    proxy_http_version 1.1;
    proxy_set_header X-Real-IP $remote_addr;
}
